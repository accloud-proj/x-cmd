name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: x-cmd_windows_amd64.zip
          - goos: windows
            goarch: arm64
            archive: x-cmd_windows_arm64.zip
          - goos: windows
            goarch: "386"
            archive: x-cmd_windows_386.zip
          - goos: linux
            goarch: amd64
            archive: x-cmd_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive: x-cmd_linux_arm64.tar.gz
          - goos: linux
            goarch: arm
            goarm: "7"
            archive: x-cmd_linux_arm.tar.gz
          - goos: darwin
            goarch: amd64
            archive: x-cmd_darwin_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            archive: x-cmd_darwin_arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/package
          BINARY="x-cmd"
          if [[ "${GOOS}" == "windows" ]]; then BINARY="x-cmd.exe"; fi
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/accloud-proj/x-cmd/internal/version.Version=${VERSION}" -o "dist/package/${BINARY}" .
          if [[ "${GOOS}" == "windows" ]]; then
            (cd dist/package && zip -9 "../${ARCHIVE}" "${BINARY}")
          else
            tar -C dist/package -czf "dist/${ARCHIVE}" "${BINARY}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: x-cmd_*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum x-cmd_* > checksums.txt
          cp ../scripts/install.sh ../scripts/install.ps1 .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/x-cmd_*
            dist/checksums.txt
            dist/install.sh
            dist/install.ps1
